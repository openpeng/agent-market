[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agent-market"
version = "1.0.0"
description = "PilotDeck Agent Market Service — lightweight marketplace for AI agent packages"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Peng Xiao", email = "team@pilotdeck.dev"},
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
]

[project.scripts]
pilotdeck-market = "src.market.server:run_server"

[tool.setuptools.packages.find]
where = ["src"]
