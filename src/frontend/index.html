<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Agent Market</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
header{background:#161b22;padding:16px 24px;border-bottom:1px solid #30363d;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:20px;color:#58a6ff}
.search-bar{display:flex;gap:8px}
.search-bar input{padding:8px 12px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;width:300px;font-size:14px}
.search-bar button{padding:8px 16px;background:#238636;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px}
.search-bar button:hover{background:#2ea043}
main{padding:24px;max-width:1200px;margin:0 auto}
.agent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.agent-card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:20px;transition:border-color .2s}
.agent-card:hover{border-color:#58a6ff}
.agent-card h3{color:#58a6ff;margin-bottom:8px;font-size:16px}
.agent-card .version{color:#8b949e;font-size:13px;margin-left:8px}
.agent-card .desc{color:#8b949e;font-size:14px;margin-bottom:12px;line-height:1.5}
.agent-card .meta{display:flex;gap:16px;font-size:12px;color:#6e7681;margin-bottom:12px}
.agent-card .meta span{display:flex;align-items:center;gap:4px}
.agent-card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.agent-card .tag{background:#1f6feb22;color:#58a6ff;padding:2px 8px;border-radius:12px;font-size:12px}
.agent-card .actions{display:flex;gap:8px}
.agent-card .actions button{padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;border:none}
.btn-download{background:#238636;color:#fff}
.btn-download:hover{background:#2ea043}
.btn-info{background:#1f6feb22;color:#58a6ff}
.btn-info:hover{background:#1f6feb44}
.stats{display:flex;gap:24px;margin-bottom:24px}
.stat-box{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px 24px;text-align:center}
.stat-box .num{font-size:28px;color:#58a6ff;font-weight:bold}
.stat-box .label{font-size:13px;color:#8b949e;margin-top:4px}
.no-results{text-align:center;padding:60px;color:#8b949e;font-size:16px}
.loading{text-align:center;padding:60px;color:#58a6ff;font-size:16px}
</style>
</head>
<body>
<header>
  <h1>Agent Market</h1>
  <div class="search-bar">
    <input id="searchInput" placeholder="搜索 Agent..." onkeyup="if(event.key==='Enter')search()">
    <button onclick="search()">搜索</button>
  </div>
</header>
<main>
  <div class="stats">
    <div class="stat-box"><div class="num" id="agentCount">-</div><div class="label">Agent 总数</div></div>
    <div class="stat-box"><div class="num" id="totalDownloads">-</div><div class="label">总下载量</div></div>
  </div>
  <div id="agentList" class="loading">加载中...</div>
</main>
<script>
const API = window.location.origin + '/api/v1';

async function loadAgents(q) {
  const list = document.getElementById('agentList');
  list.className = 'loading';
  list.textContent = '加载中...';
  try {
    const params = new URLSearchParams({page_size:'50'});
    if (q) params.set('q', q);
    const res = await fetch(API + '/agents?' + params);
    const data = await res.json();
    document.getElementById('agentCount').textContent = data.total || 0;
    const totalDownloads = data.items ? data.items.reduce((s,i) => s + (i.download_count||0), 0) : 0;
    document.getElementById('totalDownloads').textContent = totalDownloads;
    if (!data.items?.length) {
      list.className = 'no-results';
      list.textContent = '没有找到 Agent';
      return;
    }
    list.className = 'agent-grid';
    list.innerHTML = data.items.map(a => 
      '<div class="agent-card">' +
      '<h3>' + h(a.display_name||a.name) + '<span class="version">v' + h(a.version) + '</span></h3>' +
      '<div class="desc">' + h(a.description||'') + '</div>' +
      '<div class="meta">' +
      '<span>Author: ' + h(a.author||'Unknown') + '</span>' +
      '<span>Downloads: ' + (a.download_count||0) + '</span>' +
      '<span>Rating: ' + (a.rating||0).toFixed(1) + ' (' + (a.review_count||0) + ')</span>' +
      '</div>' +
      '<div class="tags">' + (a.tags||[]).map(t => '<span class="tag">' + h(t) + '</span>').join('') + '</div>' +
      '<div class="actions">' +
      '<button class="btn-download" onclick="downloadAgent(\'' + h(a.id) + '\',\'' + h(a.name) + '\',\'' + h(a.version) + '\')">Download</button>' +
      '<button class="btn-info" onclick="alert(\'ID: ' + h(a.id) + '\\nName: ' + h(a.name) + '\\nCategory: ' + h(a.category||'') + '\')">Info</button>' +
      '</div>' +
      '</div>'
    ).join('');
  } catch(e) {
    list.className = 'no-results';
    list.textContent = '加载失败: ' + e.message;
  }
}

function h(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function search() {
  loadAgents(document.getElementById('searchInput').value);
}

function downloadAgent(id, name, version) {
  const a = document.createElement('a');
  a.href = API + '/agents/' + id + '/download';
  a.download = name + '-v' + version + '.tar.gz';
  a.click();
}

loadAgents();
</script>
</body>
</html>
